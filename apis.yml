    Two NUSMods request collections (modules, venues) were removed from this repository. They
    describe the NUSModifications student organisation's API, not the university's, and crediting
    them to NUS was the same artifact-presence-is-not-provenance error the university pipeline
    exists to prevent. The relationship is retained as the nus:nusmods entry above.
