aid: nus
name: National University of Singapore
description: >-
  The National University of Singapore is Singapore's flagship public research university, ranked
  eighth in the QS World University Rankings 2025, and it is a near-perfect illustration of why a
  university is a federation of buyers rather than a producer. NUS operates exactly one substantial
  machine-readable API surface of its own: the federated identity service at vafs.nus.edu.sg, which
  publishes a live OpenID Connect discovery document, a JWKS, and signed SAML 2.0 metadata for
  entityID https://vafs.nus.edu.sg/adfs/services/trust, and which registers NUS as an identity
  provider in the Singapore Access Federation. Everything else that looks like an NUS API belongs to
  a platform NUS rents — ScholarBank@NUS is Atmire's DSpace, the learning management system is
  Instructure's Canvas, the blogs are CampusPress, the library guides are Springshare. NUS has an
  API gateway hostname at api.nus.edu.sg on a certificate issued to the university, and it returns
  HTTP 500 on every path. The campus shuttle bus API at nnextbus.nus.edu.sg is genuinely NUS's and
  genuinely live, but sits behind HTTP Basic credentials the university does not issue publicly.
  Most strikingly, NUS's own course vocabulary — modules, modular credits, prerequisite trees — has
  no public machine-readable expression from the university at all; the only OpenAPI describing NUS
  course data is published by NUSMods, a student organisation, from a non-NUS domain. There is no
  NUS developer portal, no institution-wide GitHub organisation, no public open-data portal, no
  llms.txt, and no self-service registration path to any NUS API.
