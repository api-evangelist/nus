x-coverage:
  state: gated
  reason: no_public_developer_program
  detail: >-
    NUS operates real institution-owned API surfaces, but none of them can be consumed by an
    unaffiliated caller. The federated identity service at vafs.nus.edu.sg publishes anonymously
    readable OIDC and SAML metadata, yet a client_id exists only if NUS Information Technology
    creates one and there is no public or dynamic registration endpoint. The NUS shuttle bus API
    at nnextbus.nus.edu.sg answers 401 with an HTTP Basic challenge and NUS issues no public
    credentials for it. The api.nus.edu.sg gateway is live on an NUS-issued certificate and
    returns HTTP 500 on every probed path, publishing no route at all. Two secondary limits
    apply and are recorded rather than treated as findings about NUS - the main nus.edu.sg web
    estate sits behind an Imperva bot challenge that returns 200 with a JavaScript shell for
    every deep path, so terms-of-use, IT and library pages could not be read and are not claimed
    as pointers; and nusit.nus.edu.sg answered 403 to the HPC documentation path. Everything else
    that is publicly readable belongs to a platform NUS rents. This is a correct thin profile,
    not a failed probe - 40+ URLs were fetched successfully across nine hosts.
