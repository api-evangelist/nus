description: 'National University of Singapore is a non-commercial higher-education institution and sells
  no API access. There is no pricing, no plan tier and no self-service signup anywhere in its estate.
  Access is governed by institutional affiliation rather than payment: the identity service at vafs.nus.edu.sg
  issues a client_id only when NUS Information Technology creates one, the campus shuttle bus API requires
  HTTP Basic credentials NUS does not publish, and the Canvas API requires an NUS account. The publicly
  readable surfaces - OIDC and SAML metadata, OAI-PMH, the DSpace REST API and the WordPress REST API
  - are free and open with no registration at all.'
notes: '"Free / Open" describes the anonymously readable metadata endpoints. Everything else is affiliation-gated,
  not priced.'
