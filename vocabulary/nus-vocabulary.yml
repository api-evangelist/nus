provider: National University of Singapore
providerId: nus
description: >-
  The working vocabulary of the National University of Singapore's programmable surface. It is a
  small vocabulary because the surface is small, and it is dominated by identity terms because
  identity is what NUS actually operates. Each term records the operator of the surface it was
  drawn from.
terms:
- term: VAFS
  x-operator: institution
  definition: >-
    NUS's own federated identity service, hosted at vafs.nus.edu.sg. The authorization server
    and SAML identity provider in front of essentially every gated NUS system.
  source: https://vafs.nus.edu.sg/adfs/.well-known/openid-configuration
- term: entityID
  x-operator: institution
  definition: >-
    The globally unique SAML identifier for NUS as a federation participant —
    https://vafs.nus.edu.sg/adfs/services/trust. The name other institutions and services know
    NUS by inside SGAF and eduGAIN.
  source: https://vafs.nus.edu.sg/FederationMetadata/2007-06/FederationMetadata.xml
- term: UPN
  x-operator: institution
  definition: >-
    User principal name, the claim NUS asserts to identify a person (e.g. a staff or student
    NUSNET account). Asserted in tokens; distinct from `sub`, which is pairwise.
  source: https://vafs.nus.edu.sg/adfs/.well-known/openid-configuration
- term: pairwise subject
  x-operator: institution
  definition: >-
    NUS issues a different `sub` value to each relying party for the same person, so no stable
    cross-application campus identifier is exposed through OIDC.
  source: https://vafs.nus.edu.sg/adfs/.well-known/openid-configuration
- term: SGAF
  x-operator: tenant
  definition: >-
    Singapore Access Federation, the national research-and-education identity federation
    SingAREN operates. NUS is one of its fourteen identity providers; the proxy entity NUS is
    registered under lives on SingAREN's domain.
  source: https://met.refeds.org/met/federation/singapore-access-federation-sgaf/
- term: NUSNET
  x-operator: institution
  definition: >-
    The NUS campus account namespace. Surfaces in the ScholarBank metadata registry as
    `atmire.identifier.nusnet` and underlies the UPN claim.
  source: https://scholarbank.nus.edu.sg/server/api/core/metadatafields
- term: ScholarBank@NUS
  x-operator: tenant
  definition: >-
    The NUS institutional research repository. NUS's content, DOIs and administrative contact;
    Atmire Open Repository's DSpace 7.6 software and hosting.
  source: https://scholarbank.nus.edu.sg/server/api
- term: Handle (prefix 10635)
  x-operator: tenant
  definition: >-
    The persistent identifier prefix under which ScholarBank@NUS items are addressed, e.g.
    10635/137004. NUS's assigned prefix; the Handle resolution is the repository platform's.
  source: https://scholarbank.nus.edu.sg/server/api/core/communities
- term: module
  x-operator: tenant
  definition: >-
    NUS's term for a course unit, carrying a module code (e.g. CS2103), modular credits, a
    workload 5-tuple and a prerequisite tree. The vocabulary is NUS's; the only public
    machine-readable expression of it is NUSMods', a student organisation's API.
  source: https://api.nusmods.com/v2/swagger.yaml
- term: modular credit (MC)
  x-operator: tenant
  definition: >-
    NUS's credit unit. One MC represents roughly 2.5 hours of weekly work, so a standard 4 MC
    module implies about 10 hours per week.
  source: https://api.nusmods.com/v2/swagger.yaml
- term: acadYear
  x-operator: tenant
  definition: >-
    NUS academic year, expressed in course data with the slash replaced by a dash (2025-2026).
    The primary partition key for all NUS module and timetable data.
  source: https://api.nusmods.com/v2/swagger.yaml
notes: >-
  Eleven terms, and only five of them come off a surface NUS operates. The course vocabulary —
  module, MC, acadYear, prerequisite tree — is unambiguously NUS's intellectual property and
  NUS's registry, but the only place it is written down in machine-readable form on the public
  internet is a student organisation's OpenAPI. That gap is the most interesting single fact
  about NUS's programmable footprint.
