- aid: nus:nusmods
  name: NUSMods API (student-operated, not endorsed)
  description: >-
    The only public machine-readable description of NUS course data that exists — module lists,
    module information, prerequisite trees, timetables and venue occupancy, published as an
    OpenAPI 3.0.1 document with academic-year path versioning. It is built and run by
    NUSModifications, a student organisation, on nusmods.com, and its own specification names
    mods@nusmods.com as the contact. Its description states the data is scraped daily from
    official APIs provided by the NUS Registrar's Office — meaning NUS does operate a course API,
    but not one the public can reach. No evidence of institutional endorsement or operation was
    found, so this is recorded as a relationship and its artifacts are deliberately not saved
    under NUS.
  humanURL: https://nusmods.com/
  baseURL: https://api.nusmods.com/v2
