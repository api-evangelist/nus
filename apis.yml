apis:
- aid: nus:identity
  name: NUS Federated Identity Service (VAFS)
  description: >-
    The National University of Singapore's own identity provider, and the only substantial
    machine-readable API surface the institution operates itself. Publishes an OpenID Connect
    discovery document, a JSON Web Key Set, and signed SAML 2.0 / WS-Federation metadata, all
    anonymously readable. Fronts OAuth 2.0 authorization, token, userinfo, device-code and
    logout endpoints. Relying parties are registered by NUS Information Technology; there is no
    public client registration and no self-service path.
  humanURL: https://nusit.nus.edu.sg/
