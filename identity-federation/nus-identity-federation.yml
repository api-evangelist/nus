description: >-
  Identity federation is the surface class universities operate by definition and almost never
  get catalogued for, and it is the strongest institution-owned machine-readable artifact NUS
  publishes. NUS runs its own SAML 2.0 / WS-Federation identity provider at vafs.nus.edu.sg
  ("NUS VAFS"), publishes signed metadata for it at the standard ADFS well-known path, and is a
  registered identity provider in the Singapore Access Federation (SGAF), which SingAREN
  operates and which interfederates with eduGAIN.

