- aid: nus:sgaf
  name: NUS entry in the Singapore Access Federation
  description: >-
    NUS is one of fourteen identity providers registered in the Singapore Access Federation,
    which SingAREN operates and which interfederates with eduGAIN. The entityID NUS is registered
    under is a SimpleSAMLphp proxy on singaren.net.sg, so the federation entry itself is operated
    by SingAREN on the university's behalf. A real institutional fact; not NUS's engineering.
  humanURL: https://www.singaren.net.sg/network-services/singapore-access-federation-sgaf/
  baseURL: https://nusaz.singaren.net.sg/simplesaml/saml2/idp/metadata.php
