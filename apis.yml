- aid: nus:nextbus
  name: NUS NextBus (Internal Shuttle Bus) API
  description: >-
    The API behind the NUS internal shuttle bus service — bus stops, services and arrival times
    across the Kent Ridge and Bukit Timah campuses. Institution-operated and live, but gated
    behind HTTP Basic credentials that NUS does not issue to the public, so no schema, response
    shape or operation list could be observed. Recorded because a campus transit API is one of
    the few genuinely institution-run surface classes a university has, and this one is real.
  humanURL: https://nusit.nus.edu.sg/
  baseURL: https://nnextbus.nus.edu.sg/
