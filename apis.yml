- aid: nus:scholarbank-rest
  name: ScholarBank@NUS DSpace REST API
  description: >-
    The HAL-style REST API of ScholarBank@NUS, the university's institutional repository —
    communities, collections, items, bitstreams and a 485-field metadata registry covering the
    university's scholarly output, theses and research data. The content, the Handle prefix
    10635 and the administrative contact scholarbank@nus.edu.sg are NUS's; the DSpace 7.6
    software and the hosting are Atmire Open Repository's. The contract is the vendor's and is
    deliberately not saved under this institution.
  humanURL: https://scholarbank.nus.edu.sg/
  baseURL: https://scholarbank.nus.edu.sg/server/api
